name: AnimalVoice
options:
  bundleIdPrefix: com.ashlab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AnimalVoiceAudio:
    path: Packages/AnimalVoiceAudio
  AnimalVoiceStats:
    path: Packages/AnimalVoiceStats
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  AnimalVoice:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AnimalVoiceAudio
      - package: AnimalVoiceStats
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Animal Voice
        NSMicrophoneUsageDescription: Animal Voice records your animal's sounds so you can tag and analyze them.
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/AnimalVoice.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.ashlab.AnimalVoice]
        com.apple.developer.applesignin: [Default]
        aps-environment: development
  AnimalVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: AnimalVoice
      - package: AnimalVoiceAudio
      - package: AnimalVoiceStats
schemes:
  AnimalVoice:
    build:
      targets:
        AnimalVoice: all
        AnimalVoiceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AnimalVoiceTests]
